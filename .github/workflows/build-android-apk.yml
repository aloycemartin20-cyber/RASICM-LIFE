
name: Build RASICM LIFE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Android APK
        uses: cemcoe/web-to-apk-action@v1
        with:
          app_name: "RASICM LIFE"
          app_id: "com.nexora.rasicmlife"
          web_dir: "dist"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RASICM-LIFE-APK
          path: |
            app-release.apk
            **/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
